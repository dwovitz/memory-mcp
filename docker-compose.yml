name: memory-mcp

services:
  memory-mcp:
    build:
      context: .
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      MEMORY_MCP_ENV_FILE: /app/.env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

  gateway:
    build:
      context: .
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      MEMORY_MCP_ENV_FILE: /app/.env
    # Container still listens on 0.0.0.0 internally (that's the bind inside its own network
    # namespace); the host-exposure control is the published-port host address below, per P-3.
    command: ["memory-mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      # MIG-001 step 44 / P-3: loopback by default. GATEWAY_BIND_HOST stays overridable in .env
      # for the rare case a host needs it elsewhere, but the default must never be 0.0.0.0.
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-3000}:3000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  distiller:
    build:
      context: .
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      MEMORY_MCP_ENV_FILE: /app/.env
      LOG_LEVEL: INFO
    command: ["python", "-m", "memory_mcp.distiller.runner"]
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memory_mcp}
      POSTGRES_USER: ${POSTGRES_USER:-memory_mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${PGDATA_HOST_PATH}:/var/lib/postgresql/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
